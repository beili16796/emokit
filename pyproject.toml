[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emokit"
version = "0.1.0"
description = "Modular Physiological Signal Analysis & Benchmarking Toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "EmoKit Contributors"},
]
keywords = ["EEG", "emotion recognition", "physiological signals", "BCI", "affective computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "mne>=1.4",
    "neurokit2>=0.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1", "isort>=5.12", "pre-commit>=3.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=1.3", "sphinx-autodoc-typehints>=1.24"]

[project.urls]
Homepage = "https://github.com/emokit/emokit"
Documentation = "https://emokit.readthedocs.io"
Repository = "https://github.com/emokit/emokit"

[tool.setuptools.packages.find]
include = ["emokit*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
