experiment:
  name: deap_loso_dgcnn_valence_augmented
  seed: 42
  device: cpu

dataset:
  name: DEAP
  root: ${EMOKIT_DATA_ROOT}/DEAP
  subjects: null
  window_sec: 4.0
  overlap: 0.5
  modalities: [eeg, gsr]
  label_axis: valence

feature_pipeline:
  steps:
    - name: DEExtractor
      params:
        fs: 128
        bands:
          delta: [1, 4]
          theta: [4, 8]
          alpha: [8, 13]
          beta: [13, 30]
          gamma: [30, 45]
    - name: EEGNormalizer
      params: {}
    - name: FeatureMixup
      params:
        alpha: 0.4
        p: 0.5
        seed: 42
    - name: TemporalSegmentPermutation
      params:
        n_segments: 4
        p: 0.5
        seed: 42

model:
  name: DGCNN
  params:
    n_channels: 32
    n_bands: 5
    hidden_dim: 64
    lr: 0.001
    batch_size: 64
    n_epochs: 50
    lambda_reg: 0.0001

evaluation:
  protocol: loso
  val_fraction: 0.1

output:
  results_dir: results/augmentation_ablation/deap_dgcnn_valence_augmented
  save_checkpoints: false
