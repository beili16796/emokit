experiment:
  name: quick_demo_synthetic
  seed: 42
  device: cpu

dataset:
  name: SYNTHETIC
  root: null
  subjects: null
  window_sec: 1.0
  overlap: 0.0
  modalities: [eeg]
  label_axis: null
  params:
    n_subjects: 3
    n_trials: 10
    n_channels: 14
    fs: 128
    n_classes: 2

feature_pipeline:
  steps:
    - name: EEGNormalizer
      params: {}

model:
  name: DGCNN
  params:
    n_channels: 14
    n_bands: 1
    hidden_dim: 16
    lr: 0.005
    batch_size: 32
    n_epochs: 5
    lambda_reg: 0.0001

evaluation:
  protocol: loso
  val_fraction: 0.1

output:
  results_dir: results/quick_demo/
  save_checkpoints: false
