  name: PR-PL
  params:
    n_classes: 2
    n_feat: 4096
    n_epochs: 3
    batch_size: 16
    lr: 0.001

evaluation:
  protocol: loso
  val_fraction: 0.1

output:
  results_dir: results/quick_demo/
  save_checkpoints: false
