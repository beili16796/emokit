experiment:
  name: quick_demo_synthetic
  seed: 42
  device: cpu

dataset:
  name: SYNTHETIC
  root: /tmp/emokit_synthetic
  subjects: null
  window_sec: 4.0
  overlap: 0.0
  modalities: [eeg]
  label_axis: null
  params:
    n_subjects: 3
    n_trials: 10
    n_channels: 32
    fs: 128
    n_classes: 2

feature_pipeline:
  steps:
    - name: DEExtractor
      params:
        fs: 128
    - name: EEGNormalizer
      params: {}

model:
  name: PR-PL
  params:
    n_channels: 32
    n_bands: 5
    hidden_dim: 16
    lr: 0.005
    batch_size: 32
    n_epochs: 3
    lambda_reg: 0.0001

evaluation:
  protocol: loso
  val_fraction: 0.0

output:
  results_dir: results/quick_demo/
  save_checkpoints: false
