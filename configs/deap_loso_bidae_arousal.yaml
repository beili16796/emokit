_base_: standard_protocol.yaml

experiment:
  name: deap_loso_bidae_arousal
  seed: 42
  device: cpu

dataset:
  name: DEAP
  root: ${EMOKIT_DATA_ROOT}/DEAP
  subjects: null
  window_sec: 4.0
  overlap: 0.5
  modalities: [eeg, gsr]
  label_axis: arousal
  params:
    label_threshold: 5.0

feature_pipeline:
  steps:
    - name: DEExtractor
      params: {fs: 128}
    - name: EEGNormalizer
      params: {}

model:
  name: BiDAE
  params:
    n_classes: 2
    n_feat1: 160
    n_feat2: 3
    bottleneck_dim: 128
    lambda_recon: 0.1
    mu_align: 0.01
    lr: 0.001
    batch_size: 64
    n_epochs: 50

evaluation:
  protocol: loso
  val_fraction: 0.1

output:
  results_dir: results/deap_loso_bidae_arousal
  save_checkpoints: true
