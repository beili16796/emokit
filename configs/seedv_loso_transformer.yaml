experiment:
  name: seedv_loso_transformer
  seed: 42
  device: cpu

dataset:
  name: SEED-V
  root: data/SEED-V
  subjects: null
  window_sec: 4.0
  overlap: 0.5
  modalities: [eeg]
  label_axis: null

feature_pipeline:
  steps:
    - name: DEExtractor
      params:
        fs: 200
        bands: {delta: [1, 4], theta: [4, 8], alpha: [8, 13], beta: [13, 30], gamma: [30, 45]}
    - name: EEGNormalizer
      params: {}

model:
  name: Transformer-MM
  params:
    n_channels: 62
    n_bands: 5
    d_model: 128
    n_heads: 8
    n_layers: 4
    dropout: 0.1
    lr: 0.0005
    batch_size: 64
    n_epochs: 80

evaluation:
  protocol: loso
  val_fraction: 0.1

output:
  results_dir: results/
  save_checkpoints: false
